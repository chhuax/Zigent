# Zigent CI
#
# 这个项目的核心卖点之一是「单机交叉编译出全平台产物」，所以 CI 分成两类作业：
#   1. test  —— 在 Linux / macOS 上跑单元测试、架构守卫、构建与交付契约冒烟
#   2. cross —— 在单台 Linux 上交叉编译出四个平台的产物（把卖点变成可核对的事实）
#
# 为什么不设 Windows 作业：
#   `src/util/io.zig`（唯一的 OS 边界）用了 `std.posix.HOST_NAME_MAX` 与
#   `std.posix.sigaction`，二者在 Windows 上不存在，因此 Windows 目标当前编译不过。
#   按 AGENTS.md 决策 #6「Windows / WSL 延后」，这里**不**放一个必然失败的作业
#   （那只会一直挂红）。等 Windows 分支实现后再加回来，建议形态：
#
#     windows:
#       runs-on: windows-latest
#       steps:
#         - uses: actions/checkout@v4
#         - uses: mlugg/setup-zig@v2
#           with: { version: "0.16.0" }
#         - run: zig build test --summary all
#
#   在那之前，Windows 的状态由 `zig build -Dtarget=x86_64-windows` 的报错本身记录。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一 ref 的旧运行自动取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: 版本
        run: zig version

      - name: 单元测试（12 模块 · 537 用例）
        run: zig build test --summary all

      - name: 架构约束检查（std.posix 隔离 / common 纯逻辑）
        run: zig build guard

      - name: 构建 Debug + ReleaseSafe
        run: |
          zig build
          zig build -Doptimize=ReleaseSafe
          ls -l zig-out/bin/

      - name: 交付契约冒烟（12 项）
        env:
          ZIG: zig
        run: bash tests/smoke.sh

  cross:
    name: cross · ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: 交叉编译 ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: 产物
        run: ls -l zig-out/bin/
